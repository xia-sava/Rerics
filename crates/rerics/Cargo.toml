[package]
name = "rerics"
version.workspace = true
edition.workspace = true

[features]
# 開発専用のローカル制御サーバ（既定 off・リリースには載せない）。
# serde_json は常時依存（応答 JSON を組む純粋関数を feature 無しで常時ビルド＆テストするため）。
debug-server = ["dep:tiny_http", "dep:image"]
# rar 読取（unrar crate・既定 off）。core の rar feature を引き継ぐ。
rar = ["rerics-core/rar"]

[dependencies]
rerics-core.workspace = true
unicode-width = "0.2.2"
windows = { version = "0.62.2", features = ["Win32_Media_MediaFoundation", "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Media_KernelStreaming", "Win32_UI_Shell"] }
winsafe.workspace = true
serde_json = "1"
tiny_http = { version = "0.12", optional = true }
image = { version = "0.25", optional = true }
# TS/JS スクリプト基盤（deno_core ＝ V8 埋め込み）。リリースに載る本機能なので常時ビルド。
deno_core = "0.404.0"
tokio = { version = "1.52.3", features = ["rt"] }
serde = { version = "1.0.228", features = ["derive"] }
deno_error = "=0.7.1"
deno_ast = { version = "0.53.2", features = ["transpiling"] }

[dev-dependencies]
serde_json = "1"
