[package]
name = "rerics"
version.workspace = true
edition.workspace = true

[features]
# 開発専用のローカル制御サーバ（既定 off・リリースには載せない）。
# serde_json は常時依存（応答 JSON を組む純粋関数を feature 無しで常時ビルド＆テストするため）。
debug-server = ["dep:tiny_http"]

[dependencies]
rerics-core.workspace = true
unicode-width = "0.2.2"
windows = { version = "0.62.2", features = ["Win32_Media_MediaFoundation", "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_IO", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Media_KernelStreaming", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls"] }
winsafe.workspace = true
serde_json = "1"
tiny_http = { version = "0.12", optional = true }
image = { version = "0.25" }
# PDF ページのラスタライズ（PDFium への高レベルラッパ）。実行時に vendor/pdfium の DLL を
# 動的ロードする（build.rs が exe 隣へ配置）。
pdfium-render = { version = "0.9.2", features = ["image_latest"] }
# TS/JS スクリプト基盤（deno_core ＝ V8 埋め込み）。リリースに載る本機能なので常時ビルド。
deno_core = "0.404.0"
tokio = { version = "1.52.3", features = ["rt"] }
serde = { version = "1.0.228", features = ["derive"] }
deno_error = "=0.7.1"
deno_ast = { version = "0.53.2", features = ["transpiling"] }
# 自動更新（GitHub Releases からの確認・ダウンロード・展開・検証）。TLS は既定の rustls
# ではなく native-tls（Windows は Schannel）を使い、OS のトラストストアへ一本化する
# （組込 CA バンドル crate の追加ライセンス条項を持ち込まずに済む）。
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
serde_json = "1"
