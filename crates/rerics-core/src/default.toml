theme = "system"
size_format = "simple2"
auto_adjust_columns = true
default_sort = "FileName"
reverse_sort_date = false
progress_delay_ms = 1000
bookmarks = []
menus = []
editor = "notepad.exe"

[font]
family = "BIZ UDGothic"
size = 13

[layout]
margin = 2
gap = 3
bar_height = 20
bar_gap = 2
status_bar_height = 20
tab_height = 24
log_height = 6
log_gap = 2
scrollbar_width = 7
splitter_width = 4
maximize_margin = 200
border_unit = 50

[colors.dark]
file_normal = "#ffffff"
directory = "#ffffff"
readonly = "#90ee90"
system = "#f08080"
hidden = "#add8e6"
background = "#000000"
background2 = "#202020"
selected_file = "#ffffff"
selected_file_bg = "#2f6098"
cursor = "#ffc04d"
log_background = "#000000"
log_normal = "#ffffff"
log_info = "#add8e6"
log_warning = "#90ee90"
log_error = "#ff0000"
viewer_background = "#000000"
viewer_text = "#ffffff"
viewer_line = "#008000"
viewer_separator = "#a0a0a0"
viewer_symbol = "#800080"
viewer_find_text = "#000000"
viewer_find_bg = "#ffff00"
viewer_cursor = "#4a90ff"

[colors.light]
file_normal = "#000000"
directory = "#705800"
readonly = "#008000"
system = "#008080"
hidden = "#4040a0"
background = "#ffffff"
background2 = "#f0f0f0"
selected_file = "#ffffff"
selected_file_bg = "#0078d7"
cursor = "#0060c0"
log_background = "#ffffff"
log_normal = "#000000"
log_info = "#404040"
log_warning = "#9a5a00"
log_error = "#c00000"
viewer_background = "#ffffff"
viewer_text = "#000000"
viewer_line = "#008000"
viewer_separator = "#a0a0a0"
viewer_symbol = "#800080"
viewer_find_text = "#000000"
viewer_find_bg = "#ffff00"
viewer_cursor = "#0000ff"

[[columns]]
kind = "FileBaseName"
text = "ファイル名"
width = 230
align = "Left"

[[columns]]
kind = "FileExtension"
text = "種類"
width = 60
align = "Left"

[[columns]]
kind = "Length"
text = "サイズ"
width = 90
align = "Right"

[[columns]]
kind = "LastWriteTime"
text = "更新日時"
width = 120
align = "Left"

[[columns]]
kind = "Attribute"
text = "属性"
width = 50
align = "Left"

[keybinds]
A = "reverseAllFile()"
"Alt+Enter" = "propertyDialog()"
"Alt+Left" = "historyBack()"
"Alt+PageDown" = "minimizeWindow()"
"Alt+PageUp" = "maximizeWindow()"
"Alt+Right" = "historyForward()"
BackSpace = "toParent()"
C = "copy()"
"Ctrl+A" = "selectAll()"
"Ctrl+C" = "clipCopy()"
"Ctrl+End" = "cursorEnd()"
"Ctrl+F" = "findFileDialog()"
"Ctrl+Home" = "cursorTop()"
"Ctrl+Left" = "maximizeRight()"
"Ctrl+Right" = "maximizeLeft()"
"Ctrl+Shift+Tab" = "pagePrevious()"
"Ctrl+T" = "newFiler()"
"Ctrl+Tab" = "pageNext()"
"Ctrl+V" = "clipPaste()"
"Ctrl+W" = "exit()"
"Ctrl+X" = "clipCut()"
D = "delete()"
Del = "sendToRecycled()"
Down = "cursorDown()"
E = "edit()"
Enter = "enterDir()"
Esc = "openTaskManager()"
F = "incrementalSearchDialog()"
F2 = "renameDialog()"
F3 = "findFileDialog()"
F4 = '{ const d = r.prompt("ディレクトリの入力"); if (d) r.changeDirectory(d); }'
F5 = "reload()"
Home = "clearAll()"
I = "directoryInformation()"
J = "jumpDialog()"
K = "makeDirectoryDialog()"
Left = "focusLeft()"
M = "move()"
O = "oppositeToCurrent()"
P = "compressDialog()"
PageDown = "cursorPageDown()"
PageUp = "cursorPageUp()"
Q = "quit()"
R = "renameDialog()"
Right = "focusRight()"
S = "sortDialog()"
"Shift+A" = "reverseAll()"
"Shift+D" = "directoryCompareDialog()"
"Shift+Down" = "cursorDown({select:true})"
"Shift+F1" = "openSettings()"
"Shift+F4" = '{ const d = r.folderDialog("ディレクトリの選択"); if (d) r.changeDirectory(d); }'
"Shift+Home" = "reload()"
"Shift+Left" = "previousDrive()"
"Shift+O" = "currentToOpposite()"
"Shift+P" = "pathMaskDialog()"
"Shift+PageDown" = "cursorPageDown({select:true})"
"Shift+PageUp" = "cursorPageUp({select:true})"
"Shift+Q" = "restart()"
"Shift+R" = "renameSequenceDialog()"
"Shift+Right" = "nextDrive()"
"Shift+Space" = "markToggle({cursorMove:-1})"
"Shift+Up" = "cursorUp({select:true})"
Space = "markToggle()"
T = "createShortcut()"
U = "extract()"
Up = "cursorUp()"
V = "viewFile()"
Y = "pathMaskDialog()"
Z = "commandDirect()"
'\' = "toRoot()"

[keybinds_textviewer]
B = "viewerToggleMode()"
C = "viewerChangeEncoding()"
"Ctrl+A" = "viewerSelectAll()"
"Ctrl+C" = "viewerCopy()"
"Ctrl+End" = "viewerScrollBottom()"
"Ctrl+F" = "viewerSearchDialog()"
"Ctrl+Home" = "viewerScrollTop()"
"Ctrl+PageDown" = "viewerScrollBottom()"
"Ctrl+PageUp" = "viewerScrollTop()"
"Ctrl+S" = "viewerSearchDialog()"
Down = "viewerScrollDown()"
E = "edit()"
End = "viewerScrollBottom()"
Enter = "viewerClose()"
Esc = "viewerClose()"
Home = "viewerScrollTop()"
N = "viewerFindNext()"
P = "viewerFindPrevious()"
PageDown = "viewerPageDown()"
PageUp = "viewerPageUp()"
Q = "viewerClose()"
Up = "viewerScrollUp()"

[keybinds_imageviewer]
- = "imageZoomOut()"
1 = "imageActualSize()"
2 = "imageFitWindow()"
3 = "imageFitWidth()"
4 = "imageFitHeight()"
5 = "imageFitLarge()"
";" = "imageZoomIn()"
"Ctrl+C" = "imageCopy()"
Down = "imageNext()"
Enter = "viewerClose()"
Esc = "viewerClose()"
H = "imageFlipVertical()"
L = "imageRotateLeft()"
Left = "imagePrevious()"
"NumPad+" = "imageZoomIn()"
NumPad- = "imageZoomOut()"
PageDown = "imageNext()"
PageUp = "imagePrevious()"
Q = "viewerClose()"
R = "imageRotateRight()"
Right = "imageNext()"
Space = "mediaTogglePlay()"
Up = "imagePrevious()"
V = "imageFlipHorizontal()"
X = "imageZoomOut()"
Z = "imageZoomIn()"

[cursor]
history = false
history_count = 100
to_parent = false
down_after_select = true
down_after_viewer = false
create_directory_and_move = false

[image]
wheel = "navigate"
zoom_step_percent = 25

[icons]
show = true
size = "auto"
thumbnail_size = 48

[file_ops]
ask_before_copy = false
ask_before_move = false
ask_before_delete = true
extract_create_directory = false
copy_attribute = true
copy_date = true

[window]
fixed_size = false
width = 960
height = 640

[reload_watch]
enabled = true
watch_non_fixed = false
wait_ms = 1000
