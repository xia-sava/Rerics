theme = "system"
bookmarks = []

[font]
family = "BIZ UDGothic"
size = 13

[layout]
margin = 2
gap = 3
bar_height = 20
bar_gap = 2
status_bar_height = 20
tab_height = 24
log_height = 96
log_gap = 2
scrollbar_width = 7
splitter_width = 4
maximize_margin = 200
border_unit = 50

[colors.dark]
file_normal = "#ffffff"
directory = "#ffffe8"
readonly = "#80ff80"
system = "#80ffff"
hidden = "#8080ff"
background = "#000000"
background2 = "#202020"
selected_file = "#ffffff"
selected_file_bg = "#60a080"
cursor = "#00ff80"
log_background = "#000000"
log_normal = "#ffffff"
log_info = "#c8c8c8"
log_warning = "#ffd040"
log_error = "#ff7070"

[colors.light]
file_normal = "#000000"
directory = "#705800"
readonly = "#008000"
system = "#008080"
hidden = "#4040a0"
background = "#ffffff"
background2 = "#f0f0f0"
selected_file = "#ffffff"
selected_file_bg = "#0078d7"
cursor = "#0060c0"
log_background = "#ffffff"
log_normal = "#000000"
log_info = "#404040"
log_warning = "#9a5a00"
log_error = "#c00000"

[[columns]]
kind = "FileBaseName"
text = "ファイル名"
width = 230
align = "Left"

[[columns]]
kind = "FileExtension"
text = "種類"
width = 60
align = "Left"

[[columns]]
kind = "Length"
text = "サイズ"
width = 90
align = "Right"

[[columns]]
kind = "LastWriteTime"
text = "更新日時"
width = 120
align = "Left"

[[columns]]
kind = "Attribute"
text = "属性"
width = 50
align = "Left"

[keybinds]
A = "ReverseAllFile"
"Alt+Left" = "HistoryBack"
"Alt+Right" = "HistoryForward"
BackSpace = "ToParent"
C = "Copy"
"Ctrl+A" = "SelectAll"
"Ctrl+C" = "ClipCopy"
"Ctrl+End" = "CursorEnd"
"Ctrl+Home" = "CursorTop"
"Ctrl+Left" = "MaximizeRight"
"Ctrl+Right" = "MaximizeLeft"
"Ctrl+Shift+Tab" = "PagePrevious"
"Ctrl+T" = "NewTab"
"Ctrl+Tab" = "PageNext"
"Ctrl+V" = "ClipPaste"
"Ctrl+W" = "CloseTab"
"Ctrl+X" = "ClipCut"
D = "Delete"
Del = "SendToRecycled"
Down = "CursorDown"
Enter = "EnterDir"
Esc = "OpenTaskManager"
F = "IncrementalSearchDialog"
F2 = "Rename"
F4 = "ChangeDirectoryDialog"
F5 = "Reload"
Home = "ClearAll"
I = "DirectoryInformation"
J = "JumpDialog"
K = "MakeDirectory"
Left = "FocusLeft"
M = "Move"
O = "OppositeToCurrent"
P = "Compress"
PageDown = "CursorPageDown"
PageUp = "CursorPageUp"
Q = "Quit"
R = "Rename"
Right = "FocusRight"
"Shift+A" = "ReverseAll"
"Shift+F1" = "OpenSettings"
"Shift+Home" = "Reload"
"Shift+Left" = "PreviousDrive"
"Shift+O" = "CurrentToOpposite"
"Shift+P" = "PathMask"
"Shift+R" = "RenameSequenceDialog"
"Shift+Right" = "NextDrive"
Space = "MarkToggle"
T = "CreateShortcut"
U = "Extract"
Up = "CursorUp"
V = "ViewFile"
Y = "PathMask"
'\' = "ToRoot"
