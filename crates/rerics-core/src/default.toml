theme = "system"
size_format = "simple2"
auto_adjust_columns = true
default_sort = "FileName"
reverse_sort_date = false
progress_delay_ms = 1000
bookmarks = []
editor = "notepad.exe"

[font]
family = "BIZ UDGothic"
size = 13

[layout]
margin = 2
gap = 3
bar_height = 20
bar_gap = 2
status_bar_height = 20
tab_height = 24
log_height = 6
log_gap = 2
scrollbar_width = 7
splitter_width = 4
maximize_margin = 200
border_unit = 50

[colors.dark]
file_normal = "#ffffff"
directory = "#ffffff"
readonly = "#90ee90"
system = "#f08080"
hidden = "#add8e6"
background = "#000000"
background2 = "#202020"
selected_file = "#ffffff"
selected_file_bg = "#60a080"
cursor = "#00ff80"
log_background = "#000000"
log_normal = "#ffffff"
log_info = "#add8e6"
log_warning = "#90ee90"
log_error = "#ff0000"
viewer_background = "#000000"
viewer_text = "#ffffff"
viewer_line = "#008000"
viewer_separator = "#a0a0a0"
viewer_symbol = "#800080"
viewer_find_text = "#000000"
viewer_find_bg = "#ffff00"

[colors.light]
file_normal = "#000000"
directory = "#705800"
readonly = "#008000"
system = "#008080"
hidden = "#4040a0"
background = "#ffffff"
background2 = "#f0f0f0"
selected_file = "#ffffff"
selected_file_bg = "#0078d7"
cursor = "#0060c0"
log_background = "#ffffff"
log_normal = "#000000"
log_info = "#404040"
log_warning = "#9a5a00"
log_error = "#c00000"
viewer_background = "#ffffff"
viewer_text = "#000000"
viewer_line = "#008000"
viewer_separator = "#a0a0a0"
viewer_symbol = "#800080"
viewer_find_text = "#000000"
viewer_find_bg = "#ffff00"

[[columns]]
kind = "FileBaseName"
text = "ファイル名"
width = 230
align = "Left"

[[columns]]
kind = "FileExtension"
text = "種類"
width = 60
align = "Left"

[[columns]]
kind = "Length"
text = "サイズ"
width = 90
align = "Right"

[[columns]]
kind = "LastWriteTime"
text = "更新日時"
width = 120
align = "Left"

[[columns]]
kind = "Attribute"
text = "属性"
width = 50
align = "Left"

[keybinds]
A = "ReverseAllFile"
"Alt+Enter" = "PropertyDialog"
"Alt+Left" = "HistoryBack"
"Alt+PageDown" = "MinimizeWindow"
"Alt+PageUp" = "MaximizeWindow"
"Alt+Right" = "HistoryForward"
BackSpace = "ToParent"
C = "Copy"
"Ctrl+A" = "SelectAll"
"Ctrl+C" = "ClipCopy"
"Ctrl+End" = "CursorEnd"
"Ctrl+Home" = "CursorTop"
"Ctrl+Left" = "MaximizeRight"
"Ctrl+Right" = "MaximizeLeft"
"Ctrl+Shift+Tab" = "PagePrevious"
"Ctrl+T" = "NewTab"
"Ctrl+Tab" = "PageNext"
"Ctrl+V" = "ClipPaste"
"Ctrl+W" = "CloseTab"
"Ctrl+X" = "ClipCut"
D = "Delete"
Del = "SendToRecycled"
Down = "CursorDown"
E = "Edit"
Enter = "EnterDir"
Esc = "OpenTaskManager"
F = "IncrementalSearchDialog"
F2 = "Rename"
F4 = 'ChangeDirectory("<I:ディレクトリの入力>")'
F5 = "Reload"
Home = "ClearAll"
I = "DirectoryInformation"
J = "JumpDialog"
K = "MakeDirectory"
Left = "FocusLeft"
M = "Move"
O = "OppositeToCurrent"
P = "Compress"
PageDown = "CursorPageDown"
PageUp = "CursorPageUp"
Q = "Quit"
R = "Rename"
Right = "FocusRight"
S = "SortDialog"
"Shift+A" = "ReverseAll"
"Shift+Down" = 'CursorDown("select")'
"Shift+F1" = "OpenSettings"
"Shift+F4" = 'ChangeDirectory("<FOLDERDIALOG:ディレクトリの選択>")'
"Shift+Home" = "Reload"
"Shift+Left" = "PreviousDrive"
"Shift+O" = "CurrentToOpposite"
"Shift+P" = "PathMask"
"Shift+PageDown" = 'CursorPageDown("select")'
"Shift+PageUp" = 'CursorPageUp("select")'
"Shift+Q" = "Restart"
"Shift+R" = "RenameSequenceDialog"
"Shift+Right" = "NextDrive"
"Shift+Space" = 'MarkToggle("-1")'
"Shift+Up" = 'CursorUp("select")'
Space = "MarkToggle"
T = "CreateShortcut"
U = "Extract"
Up = "CursorUp"
V = "ViewFile"
Y = "PathMask"
'\' = "ToRoot"

[keybinds_textviewer]
B = "ViewerToggleMode"
C = "ViewerChangeEncoding"
"Ctrl+A" = "ViewerSelectAll"
"Ctrl+C" = "ViewerCopy"
"Ctrl+End" = "ViewerScrollBottom"
"Ctrl+F" = "ViewerSearchDialog"
"Ctrl+Home" = "ViewerScrollTop"
"Ctrl+PageDown" = "ViewerScrollBottom"
"Ctrl+PageUp" = "ViewerScrollTop"
"Ctrl+S" = "ViewerSearchDialog"
Down = "ViewerScrollDown"
E = "Edit"
End = "ViewerScrollBottom"
Enter = "ViewerClose"
Esc = "ViewerClose"
Home = "ViewerScrollTop"
N = "ViewerFindNext"
P = "ViewerFindPrevious"
PageDown = "ViewerPageDown"
PageUp = "ViewerPageUp"
Q = "ViewerClose"
Up = "ViewerScrollUp"

[keybinds_imageviewer]
- = "ImageZoomOut"
0 = "ImageFitWindow"
1 = "ImageActualSize"
";" = "ImageZoomIn"
"Ctrl+C" = "ImageCopy"
Down = "ImageNext"
Enter = "ViewerClose"
Esc = "ViewerClose"
H = "ImageFlipVertical"
L = "ImageRotateLeft"
Left = "ImagePrevious"
"NumPad+" = "ImageZoomIn"
NumPad- = "ImageZoomOut"
PageDown = "ImageNext"
PageUp = "ImagePrevious"
Q = "ViewerClose"
R = "ImageRotateRight"
Right = "ImageNext"
Space = "MediaTogglePlay"
Up = "ImagePrevious"
V = "ImageFlipHorizontal"

[cursor]
history = false
history_count = 100
to_parent = false
down_after_select = true

[image]
wheel = "navigate"

[icons]
show = true
size = "auto"

[file_ops]
ask_before_copy = false
ask_before_move = false
ask_before_delete = true
extract_create_directory = false
copy_attribute = true
copy_date = true
